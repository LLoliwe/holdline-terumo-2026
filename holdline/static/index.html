<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HOLDLINE · cold chain hold queue</title><link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="app.css"></head>
<body>
<header class="bar">
 <div class="brand"><svg width="26" height="26" viewBox="0 0 40 40"><rect x="1" y="1" width="38" height="38" rx="4" fill="none" stroke="#fff" stroke-width="2"/><line x1="1" y1="15" x2="39" y2="15" stroke="#E0574F" stroke-width="3"/><path d="M6 30 L14 26 L20 28 L26 18 L34 22" fill="none" stroke="#fff" stroke-width="2"/></svg><b>HOLDLINE</b><span class="sub">Synthetic data · demo</span></div>
 <div class="right"><span id="net" class="chip ok">Online</span><span id="queue" class="chip un" style="display:none"></span>
 <span class="who" id="who"></span><form id="login" class="who"><select id="luser" aria-label="Demo user"><option value="demo.officer">demo.officer (duty officer)</option><option value="demo.manager">demo.manager (qualified)</option><option value="demo.manager2">demo.manager2 (qualified)</option></select><input id="lpin" type="password" inputmode="numeric" placeholder="PIN" size="5" aria-label="PIN"><button class="btn chip ve">Sign in</button></form><span class="chip un" title="Synthetic users and PINs. Not real authentication.">Demo log-in</span></div>
</header>
<section class="metrics" id="metrics"></section>
<main>
 <aside><div class="tabs"><button data-s="OPEN" class="on">Open</button><button data-s="ACCEPTED">Accepted</button><button data-s="CHANGED">Changed</button><button data-s="REJECTED">Rejected</button></div><div id="list"></div></aside>
 <article id="detail"><p class="empty">Pick a hold from the list.</p></article>
</main>
<script src="app.js"></script></body></html>
